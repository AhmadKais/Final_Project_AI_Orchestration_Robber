# Private, local configuration for the Robber (thief) peer.
# Not signed, not sent over the network, not subject to negotiation.
# Shared/agreed values live in ../game.json and always override matching keys here.

version = "0.1.0"

[game]
group_name = "ali-Ahm1"
group_id   = "ali-ahm1"
sub_game_number = 1
members = ["Ali - Trabeh", "Ahmad - Kais"]
repos = { cop = "https://github.com/AhmadKais/Final_Project_AI_Orchestration", thief = "https://github.com/AhmadKais/Final_Project_AI_Orchestration_Robber" }

[network]
my_port      = 8802                            # MY MCP server port
opponent_url = "http://127.0.0.1:8801/mcp"     # the only thing I know about the opponent
turn_timeout_seconds = 180

# [strategy] -- optional: point at YOUR brain subclass (else the shipped heuristic runs)
# thief_class = "police_thief.domain.strategy:MyThiefBrain"

# [trash_talk] -- optional: HOW the banter is produced. The MOVE is always pure Python.
# provider = "template"   # template (0 tokens, default) | ollama | claude_api | claude_cli
# every_n_steps = 1

[llm]
model = "claude-opus-4-8[1m]"     # MY choice; the opponent may differ
step_deadline_seconds = 30        # hard cap on LLM thinking per step

[email]
recipient = "rmisegal+uoh26finalgame@gmail.com"
mode = "draft"
